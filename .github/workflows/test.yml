name: Test automation

on:
  pull_request:
  push:
    branches:
      - main
      - manus/**

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
